<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#009ee3">
<title>Simulador de Notificação</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;min-height:100vh;background:#f2f5f7;display:flex;justify-content:center;align-items:center;padding:20px}
.card{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:25px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
h1{text-align:center;color:#009ee3}
.simulacao{text-align:center;background:#fff3cd;color:#856404;padding:10px;border-radius:10px;font-weight:bold;margin-bottom:20px}
label{display:block;margin-top:15px;margin-bottom:6px;font-weight:bold}
input,select{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px}
button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#009ee3;color:#fff;font-size:17px;font-weight:bold;cursor:pointer}
.resultado{margin-top:20px;padding:15px;background:#f5f5f5;border-radius:10px;display:none}
.aviso{margin-top:15px;font-size:12px;color:#666;text-align:center}
</style>
</head>
<body>
<div class="card">
<h1>Simulador</h1>
<div class="simulacao">⚠️ NOTIFICAÇÃO DE SIMULAÇÃO</div>
<label for="valor">Valor</label>
<input id="valor" type="number" min="0.01" step="0.01" placeholder="150.00">
<label for="origem">Banco de origem</label>
<select id="origem">
<option>Banco Exemplo</option><option>Banco Digital Exemplo</option><option>Banco Teste</option><option>Outro banco</option>
</select>
<label for="destino">Banco de destino</label>
<select id="destino">
<option>Conta de Teste</option><option>Banco Exemplo 2</option><option>Carteira de Teste</option>
</select>
<button onclick="pedirPermissao()">Ativar notificações</button>
<button onclick="mostrarSimulacao()">🔔 Mostrar simulação</button>
<div id="resultado" class="resultado"></div>
<div class="aviso">Esta página é apenas uma demonstração. Nenhum pagamento ou transferência é realizado.</div>
</div>
<script>
function formatarValor(valor){
return Number(valor).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}
async function pedirPermissao(){
if(!("Notification" in window)){alert("Este navegador não suporta notificações.");return;}
const permissao=await Notification.requestPermission();
alert(permissao==="granted"?"Notificações ativadas.":"A permissão para notificações não foi concedida.");
}
function mostrarSimulacao(){
const valor=document.getElementById("valor").value;
const origem=document.getElementById("origem").value;
const destino=document.getElementById("destino").value;
if(!valor||Number(valor)<=0){alert("Digite um valor.");return;}
const valorFormatado=formatarValor(valor);
const texto=`SIMULAÇÃO: ${valorFormatado} recebido de ${origem} para ${destino}.`;
const resultado=document.getElementById("resultado");
resultado.style.display="block";
resultado.innerHTML=`<strong>🔔 Simulação criada</strong><br><br>Valor: ${valorFormatado}<br>Origem: ${origem}<br>Destino: ${destino}`;
if("Notification" in window&&Notification.permission==="granted"){
new Notification("SIMULAÇÃO — Transferência",{body:texto,tag:"simulacao-transferencia"});
}else{alert("Ative as notificações primeiro para receber a simulação.");}
}
</script>
</body>
</html>
