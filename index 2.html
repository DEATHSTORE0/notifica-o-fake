<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4f6">
<title>Demo de notificações</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.box{max-width:430px;margin:auto;background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.1)}
h1{text-align:center;font-size:25px;margin:0 0 20px}
label{display:block;font-weight:700;margin:15px 0 7px}
select,input{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;background:#fff}
.custom{display:none;margin-top:8px}
.brand{display:flex;align-items:center;gap:11px;background:#f7f7f8;border-radius:13px;padding:10px;margin-top:9px}
.icon{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800}
.brand-name{font-weight:700}
button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:18px;font-size:16px;font-weight:700;background:#1677ff;color:#fff}
button.dark{background:#111827}
.card{display:none;margin-top:20px;background:#eef0f3;border-radius:17px;padding:14px}
.notice{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 7px rgba(0,0,0,.08)}
.notice-top{display:flex;gap:10px;align-items:center}
.notice-icon{width:38px;height:38px;border-radius:10px;color:#fff;display:grid;place-items:center;font-weight:800}
.notice-app{font-size:14px;font-weight:700}
.notice-time{font-size:12px;color:#777;margin-left:auto}
.notice-body{margin-top:9px;font-size:15px;line-height:1.4}
.demo-label{margin-top:10px;font-size:11px;color:#6b7280;text-align:center}
.note{margin-top:14px;text-align:center;color:#6b7280;font-size:12px;line-height:1.35}
</style>
</head>
<body>
<div class="box">
<h1>Gerador de demonstração</h1>

<label for="origem">Origem</label>
<select id="origem" onchange="changeOrigin()">
<option>Mercado Pago</option>
<option>Nubank</option>
<option>PicPay</option>
<option>Cakto</option>
<option>Spotify</option>
<option value="manual">Digitar manualmente</option>
</select>

<input id="origemManual" class="custom" maxlength="40" placeholder="Nome do banco ou serviço">

<div class="brand">
<div id="brandIcon" class="icon">MP</div>
<div id="brandName" class="brand-name">Mercado Pago</div>
</div>

<label for="destino">Destino</label>
<input id="destino" maxlength="40" placeholder="Digite o banco ou serviço de destino">

<label for="valor">Valor</label>
<input id="valor" type="number" min="0.01" max="50000" step="0.01" placeholder="150,00">

<div style="font-size:12px;color:#6b7280;margin-top:6px">Máximo: R$ 50.000,00</div>

<button onclick="createDemo()">Criar notificação</button>
<button class="dark" onclick="requestPermission()">Ativar notificações</button>

<div id="preview" class="card">
<div class="notice">
<div class="notice-top">
<div id="noticeIcon" class="notice-icon">MP</div>
<div id="noticeApp" class="notice-app">Mercado Pago</div>
<div class="notice-time">agora</div>
</div>
<div id="noticeBody" class="notice-body"></div>
</div>
<div class="demo-label">DEMONSTRAÇÃO — sem transação ou integração bancária</div>
</div>

<div class="note">
Os ícones são personalizados e não são logotipos oficiais.
Nenhum pagamento ou saldo é alterado.
</div>
</div>

<script>
const brands = {
"Mercado Pago":{initials:"MP",color:"#168cff"},
"Nubank":{initials:"N",color:"#6f2cff"},
"PicPay":{initials:"PP",color:"#16b875"},
"Cakto":{initials:"C",color:"#ff6b35"},
"Spotify":{initials:"S",color:"#18a558"}
};

function getOrigin(){
const s=document.getElementById("origem");
if(s.value==="manual"){
return document.getElementById("origemManual").value.trim()||"Serviço";
}
return s.value;
}

function dataFor(name){
return brands[name]||{
initials:name.replace(/[^a-zA-ZÀ-ÿ0-9]/g,"").slice(0,2).toUpperCase()||"?",
color:"#3f4650"
};
}

function updateBrand(){
const name=getOrigin();
const d=dataFor(name);
document.getElementById("brandIcon").textContent=d.initials;
document.getElementById("brandIcon").style.background=d.color;
document.getElementById("brandName").textContent=name;
}

function changeOrigin(){
const manual=document.getElementById("origemManual");
const isManual=document.getElementById("origem").value==="manual";
manual.style.display=isManual?"block":"none";
if(isManual) manual.focus();
updateBrand();
}

document.getElementById("origemManual").addEventListener("input",updateBrand);

function money(v){
return Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

function createDemo(){
const value=Number(document.getElementById("valor").value);
const destination=document.getElementById("destino").value.trim();
const origin=getOrigin();

if(!value||value<0.01||value>50000){
alert("Digite um valor entre R$ 0,01 e R$ 50.000,00.");
return;
}

if(!destination){
alert("Digite o banco ou serviço de destino.");
return;
}

const d=dataFor(origin);
const text=money(value)+" recebido de "+origin+" para "+destination+".";

document.getElementById("noticeIcon").textContent=d.initials;
document.getElementById("noticeIcon").style.background=d.color;
document.getElementById("noticeApp").textContent=origin;
document.getElementById("noticeBody").textContent=text;
document.getElementById("preview").style.display="block";

if("Notification" in window&&Notification.permission==="granted"){
new Notification(origin, {
  body: text,
  icon: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128">
      <rect width="128" height="128" rx="28" fill="${d.color}"/>
      <text x="64" y="78" text-anchor="middle" font-family="Arial" font-size="42" font-weight="bold" fill="white">${d.initials}</text>
    </svg>`
  ),
  tag: "demo-notification"
});
}
}

async function requestPermission(){
if(!("Notification" in window)){
alert("Este navegador não disponibiliza notificações para esta página.");
return;
}

const result=await Notification.requestPermission();

if(result==="granted"){
alert("Permissão concedida.");
}else{
alert("A permissão não foi concedida.");
}
}
</script>
</body>
</html>
